name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install .NET Framework 4.7.2 targeting pack
        continue-on-error: true
        run: choco install netfx-4.7.2-devpack -y --no-progress

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build
        run: msbuild SnapPin.sln /p:Configuration=Release /p:Platform="Any CPU" /m /v:minimal /nologo

      - name: Package
        shell: pwsh
        run: |
          $out = Join-Path $PWD "SnapPin/bin/Release"
          $zip = Join-Path $PWD "SnapPin-${{ github.ref_name }}-win.zip"
          Compress-Archive -LiteralPath (Join-Path $out "SnapPin.exe"), (Join-Path $out "SnapPin.exe.config") -DestinationPath $zip -Force
          "ZIP=$zip" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SnapPin-${{ github.ref_name }}
          path: ${{ env.ZIP }}

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: SnapPin ${{ github.ref_name }}
          files: ${{ env.ZIP }}
          generate_release_notes: true
